[project]
name = "schemaflow"
version = "0.1.0"
description = "A VS Code extension that generates TypeScript interfaces from JSON Schema files on save, with live preview."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
schemaflow = "schemaflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["schemaflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
